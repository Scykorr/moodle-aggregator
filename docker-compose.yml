services:
  db:
    image: mariadb:11.4
    pull_policy: missing
    container_name: moodle_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MOODLE_DATABASE_NAME:-moodle}
      MYSQL_USER: ${MOODLE_DATABASE_USER:-moodle}
      MYSQL_PASSWORD: ${MOODLE_DATABASE_PASSWORD:-moodlepass}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-file-per-table=1
      - --innodb-buffer-pool-size=512M
    volumes:
      - moodle_db_data:/var/lib/mysql
    networks:
      - moodle_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  moodle:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MOODLE_BRANCH: ${MOODLE_BRANCH:-MOODLE_502_STABLE}
    image: moodle-offline:5.2
    pull_policy: missing
    container_name: moodle_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${MOODLE_HTTP_PORT:-80}:80"
    environment:
      MOODLE_DATABASE_HOST: db
      MOODLE_DATABASE_PORT: 3306
      MOODLE_DATABASE_NAME: ${MOODLE_DATABASE_NAME:-moodle}
      MOODLE_DATABASE_USER: ${MOODLE_DATABASE_USER:-moodle}
      MOODLE_DATABASE_PASSWORD: ${MOODLE_DATABASE_PASSWORD:-moodlepass}
      MOODLE_DATABASE_PREFIX: ${MOODLE_DATABASE_PREFIX:-mdl_}
      MOODLE_WWWROOT: ${MOODLE_WWWROOT:-http://localhost}
      MOODLE_SITE_FULLNAME: ${MOODLE_SITE_FULLNAME:-Moodle LMS}
      MOODLE_SITE_SHORTNAME: ${MOODLE_SITE_SHORTNAME:-Moodle}
      MOODLE_ADMIN_USER: ${MOODLE_ADMIN_USER:-admin}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD:-Admin123!}
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL:-admin@example.com}
      MOODLE_LANG: ${MOODLE_LANG:-ru}
      MOODLE_DATAROOT: /var/www/moodledata
    volumes:
      - moodle_data:/var/www/moodledata
    networks:
      - moodle_net

networks:
  moodle_net:
    driver: bridge

volumes:
  moodle_db_data:
  moodle_data:
