name: moodle-aggregator
services:
  aggregator:
    image: moodle-aggregator:local
    pull_policy: never
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "${AGGREGATOR_BIND_IP:-127.0.0.1}:${AGGREGATOR_PORT:-8090}:8080"
    environment:
      AGGREGATOR_TOKEN: ${AGGREGATOR_TOKEN:-}
    volumes:
      - aggregator_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  aggregator_data:
